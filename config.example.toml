# edgehop config: ~/.config/edgehop/config.toml
# The same file shape on every machine; only `name` and `peers` differ.

# This machine's name. Peers list it under exactly this name.
name = "laptop"

# Accept peers on this address (port defaults to 24801). Leave it out on a
# machine that only dials out, e.g. one behind a firewall.
listen = "0.0.0.0:24801"

# Shared secret, identical on every machine. Make one with `edgehop keygen`.
# Anyone holding it can type on your machines: keep the file private (chmod 600).
psk = "REPLACE-WITH-OUTPUT-OF-edgehop-keygen-AAAAAAA="

# Hold these together while driving another machine to snap back home.
release_keys = ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_ESC"]

# Don't cross over while the focused window is fullscreen (games).
block_when_fullscreen = true

# Desktop notifications on crossing: which machine has your input, how to get back.
notify = true

# Name your `edgehop switch` keybind here and the notifications mention it.
# switch_hint = "Super+Alt+K"

# Devices never captured (case-insensitive substring of the device name).
ignore_devices = []

# Remote view: while you drive another machine, see its screen here, full
# screen, following the cursor from monitor to monitor. `edgehop view` (bind it
# to a key on every machine) switches it on/off; once on, it opens each time you
# cross over and closes when you come back. Needs gpu-screen-recorder on the
# machine being watched and mpv on the one watching.
[view]
on = true
# What you ask for when watching (the other machine encodes it).
fps = 60
bitrate_kbps = 20000
codec = "h264"            # or "hevc"
# hint = "Super+Alt+L"    # your `edgehop view` keybind, named in notifications
# Override the commands if you like. capture prints a raw Annex-B stream of
# {monitor} to stdout ({fps} {kbps} {codec}); player shows stdin ({codec} {peer}).
# capture = ["gpu-screen-recorder", "-w", "{monitor}", "-f", "{fps}", "-k", "{codec}",
#            "-bm", "cbr", "-q", "{kbps}", "-tune", "performance", "-c", "{codec}", "-o", "/dev/stdout"]
# player = ["mpv", "--profile=low-latency", "--untimed", "--demuxer-lavf-format={codec}", "--fs", "-"]

# One block per neighbouring machine.
[[peers]]
name = "desktop"
# Where its screens are, seen from here: left, right, top or bottom.
side = "left"
# Only these outputs' edges lead to it (names from `hyprctl monitors`); empty = all.
# monitors = ["DP-1"]
# Keep pushing against the edge this long (ms) before crossing, e.g. when a
# bar sits on that edge.
# edge_delay_ms = 150
# Dial it here. Leave `address` out if that machine dials this one instead
# (one side dialing is enough; the link carries both directions).
# address = "192.168.1.20:24801"
