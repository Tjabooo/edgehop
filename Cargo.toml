[package]
name = "edgehop"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Software KVM for Wayland (Hyprland): push the cursor off a screen edge to drive the machine next to it"
license = "MIT"
repository = "https://github.com/Tjabooo/edgehop"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
env_logger = "0.11.11"
evdev = { version = "0.13.2", features = ["tokio"] }
getrandom = "0.4.3"
libc = "0.2.191"
log = "0.4.35"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
toml = "1.2.1"
